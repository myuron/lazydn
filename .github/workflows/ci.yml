name: CI

# When: on every push to main and on every pull request targeting main.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  # How: install the stable toolchain, restore the cargo cache,
  # then run the same checks as `just check`.
  cargo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked --all-features

  # When: on the same triggers, so release targets other than x86_64-linux
  # are tested before a tag is pushed.
  # How: run the test suite natively on the arm Linux and macOS runners.
  test-platforms:
    strategy:
      matrix:
        os: [macos-15, ubuntu-22.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked --all-features

  # How: build the package through the flake and run treefmt / flake checks
  # so that the Nix definitions never drift from Cargo.lock.
  nix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - run: nix build --print-build-logs
      - run: nix flake check --print-build-logs
