[package]
name = "lazydn"
version = "0.1.0"
edition = "2024"
description = "A terminal UI application"
license = "MIT"
repository = "https://github.com/myuron/lazydn"

[dependencies]
base64 = "0.22"
color-eyre = "0.6.5"
crossterm = "0.29.0"
ratatui = "0.30.2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10"
ssh-key = { version = "0.6.7", default-features = false, features = ["ed25519", "std", "alloc", "rand_core", "getrandom"] }
time = { version = "0.3.55", features = ["parsing", "formatting", "macros", "serde", "local-offset"] }
unicode-segmentation = "1.13.3"
unicode-width = "0.2.2"
url = "2.5.8"

[dev-dependencies]
insta = "1.49.0"
tempfile = "3.27.0"
wiremock = "0.6.5"
tokio = { version = "1.54.0", features = ["macros", "rt-multi-thread", "time"] }
