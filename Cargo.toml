[package]
name = "lazydn"
version = "0.1.0"
edition = "2024"
description = "A terminal UI application"
license = "MIT"
repository = "https://github.com/myuron/lazydn"

[dependencies]
color-eyre = "0.6.5"
crossterm = "0.29.0"
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
time = { version = "0.3.55", features = ["parsing", "formatting", "macros", "serde"] }
unicode-segmentation = "1.13.3"
unicode-width = "0.2.2"

[dev-dependencies]
insta = "1.49.0"
